<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Быки и коровы</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game">
<h1>Быки и коровы</h1>
<p class="hint">Загадано число из 4 разных цифр. Попробуйте угадать.</p>
<div class="controls">
<input type="text" id="guess" maxlength="4" inputmode="numeric" autocomplete="off" placeholder="1234">
<button id="check" type="button">Проверить</button>
</div>
<p id="message" class="message"></p>
<p class="counter">Попыток: <span id="attempts">0</span></p>
<ul id="history" class="history"></ul>
<button id="newGame" type="button" class="secondary">Новая игра</button>
</main>
<script src="script.js" defer></script>
</body>
</html>
